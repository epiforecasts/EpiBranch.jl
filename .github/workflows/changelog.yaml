name: Changelog

# A pull request records its entry as a file in `changelog.d/` (see that
# directory's README). This checks one is there, because the entry is easy to
# forget once it is no longer part of editing `CHANGELOG.md`.
#
# Add the `no changelog` label for a change that warrants no entry, such as one
# touching only CI or tests.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragment:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two, so the merge commit's parents are both present.
          fetch-depth: 2
      - name: Check for a changelog fragment
        run: |
          # Tolerated so this workflow can merge before or after the one that
          # creates the directory.
          if [ ! -d changelog.d ]; then
            echo "no changelog.d/ in this revision: nothing to check"
            exit 0
          fi
          # `HEAD` is `refs/pull/N/merge`, so `HEAD^1` is the current base tip
          # and the diff is this pull request's own change. `base.sha` from the
          # event is the base as it stood when the branch was last pushed,
          # which in this repository is routinely several merges behind, and
          # diffing from it would count a fragment another pull request merged
          # in the meantime as this one's.
          if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "HEAD is not a merge ref, so the base cannot be identified." >&2
            exit 1
          fi
          # `A` for added: a modification to someone else's existing fragment
          # is not this pull request's entry.
          #
          # Matched against the shape `scripts/changelog.jl` accepts, rather
          # than any `.md`: that script errors on an unknown category prefix
          # and reads the directory non-recursively, so `fix-x.md` or
          # `sub/x.md` would pass here and then break `task changelog` on main
          # for everyone.
          # `core.quotePath=false`, or git wraps a non-ASCII path in quotes
          # with octal escapes and the pattern below stops matching it.
          added=$(git -c core.quotePath=false diff --name-only --diff-filter=A HEAD^1 HEAD \
            -- 'changelog.d/*.md' \
            | grep -E '^changelog\.d/(added|changed|deprecated|removed|fixed|security)-[^/]+\.md$' \
            || true)
          if [ -z "$added" ]; then
            echo "This pull request adds no changelog fragment."
            echo "Add changelog.d/<category>-<slug>.md, or apply the"
            echo "'no changelog' label if the change warrants no entry."
            echo "See changelog.d/README.md."
            exit 1
          fi
          echo "found:"
          echo "$added"
