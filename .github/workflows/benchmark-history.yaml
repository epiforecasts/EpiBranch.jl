name: Benchmark history

# Persistent benchmark timeline. The PR-comparison workflow
# (`benchmark.yaml`) runs on `pull_request` and only posts a base-vs-head
# comment; it never records history. This workflow runs on pushes to `main`
# and on tags, benchmarking the last few tagged releases plus HEAD so a
# timeline accumulates. Triggers are disjoint from `benchmark.yaml`, so the
# two never run on the same event.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# `contents: write` lets JamesIves/github-pages-deploy-action push the
# generated plots to the `benchmarks` branch.
permissions:
  contents: write

# Serialise history deploys so concurrent pushes/tags don't race on the
# `benchmarks` branch. Not keyed on ref, so a tag push and a main push queue
# rather than clobber; cancel-in-progress: false keeps every recorded point.
concurrency:
  group: benchmark-history-deploy
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so all tags resolve; benchpkg checks out each
      # historical rev from this working tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - uses: julia-actions/cache@v3

      # benchmark/Project.toml names the satellite packages as path sources
      # at `../lib/EpiNetwork` and `../lib/EpiHouseholds`. benchpkg copies
      # that file into a `/tmp/` tempdir, where Pkg resolves the relative
      # sources to `/tmp/lib/...`, so stage them there.
      - name: Stage the satellite packages for AirspeedVelocity
        run: |
          mkdir -p /tmp/lib
          cp -r lib/EpiNetwork lib/EpiHouseholds /tmp/lib/

      - name: Install AirspeedVelocity
        run: |
          julia -e 'ENV["JULIA_PKG_PRECOMPILE_AUTO"]=0;
                    import Pkg; Pkg.add("AirspeedVelocity");
                    Pkg.build("AirspeedVelocity")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"

      # benchpkg installs the package into its own temp project, where Pkg
      # honours only the *active* project's `[sources]`. A dependency pinned
      # there by git url/rev (not yet registered) cannot resolve in that temp
      # project and fails with "has no known versions!" (#216). Register each
      # such pin into a throwaway registry in this runner's depot instead:
      # registries are depot-level, so the dependency then resolves by name
      # in every environment on the runner. A package with no unregistered
      # pins is a no-op.
      #
      # The scratch registry from an earlier run is stale (cached depot), so
      # drop it first, before the guard: otherwise a package that has since
      # dropped its pin is left with a registry still carrying the name,
      # which fails the depot with a hash mismatch.
      - name: Bootstrap registry for unregistered [sources] deps
        run: |
          rm -rf "${JULIA_DEPOT_PATH:-$HOME/.julia}/registries/EpiAwareScratch"
          if ! grep -qE '^\[sources(\.|\])' Project.toml; then
            echo "no [sources] section: nothing to register"
            exit 0
          fi
          julia -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add([
                Pkg.PackageSpec(name = "LocalRegistry"),
                Pkg.PackageSpec(
                    url = "https://github.com/EpiAware/EpiAwarePackageTools.jl",
                    rev = "main")])
            using EpiAwarePackageTools.Benchmarks: bootstrap_sources_registry
            done = bootstrap_sources_registry(pwd())
            println(isempty(done) ? "no unregistered [sources] deps" :
                    "registered: " * join(done, ", "))'

      # Last 5 tags (newest first) plus the pushed commit. On a tag push
      # GITHUB_SHA already points at the tagged commit, so HEAD is the
      # newest point either way.
      - name: Collect revs (last 5 tags + HEAD)
        id: revs
        run: |
          TAGS=$(git tag --sort=-v:refname | head -5 | paste -sd, -)
          if [ -n "$TAGS" ]; then
            echo "revs=${TAGS},${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            # No tags yet: emit the bare SHA so revs carries no leading
            # comma, which benchpkg rejects (#125).
            echo "revs=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # benchpkg benchmarks each rev against benchmark/benchmarks.jl.
      # --bench-on pins the benchmark script to HEAD so older revs are
      # measured with the current suite definition. --tune re-tunes
      # parameters per run to quieten noise on shared runners. --url points
      # benchpkg at this repo directly so it resolves an unregistered
      # package (#125); harmless once registered.
      - name: Run benchmarks
        run: |
          mkdir -p results
          benchpkg EpiBranch \
            --url="https://github.com/${{ github.repository }}" \
            --rev="${{ steps.revs.outputs.revs }}" \
            --bench-on="${{ github.sha }}" \
            --output-dir=results \
            --tune

      # benchpkgplot auto-flattens the BenchmarkGroup into one PNG per
      # leaf benchmark (SVG is unsupported). benchpkgtable emits a
      # markdown ratio summary linked from the index.
      - name: Plot timeline and table
        run: |
          mkdir -p public
          benchpkgplot EpiBranch \
            --rev="${{ steps.revs.outputs.revs }}" \
            --npart=20 --format=png \
            --input-dir=results --output-dir=public
          benchpkgtable EpiBranch \
            --rev="${{ steps.revs.outputs.revs }}" \
            --input-dir=results --ratio --mode time,memory \
            > public/table.md

      # Minimal index so the published folder lists the generated plots.
      - name: Write index page
        run: |
          {
            echo "# EpiBranch.jl benchmark history"
            echo
            echo "Revisions: ${{ steps.revs.outputs.revs }}"
            echo
            echo "See \`table.md\` for the ratio summary and the PNG"
            echo "files in this folder for per-benchmark timelines."
          } > public/README.md

      # Deploy to a dedicated `benchmarks` branch, deliberately not
      # gh-pages: Documenter force-pushes gh-pages on every docs build,
      # which would clobber anything written there.
      - name: Deploy to benchmarks branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: benchmarks
          folder: public
          target-folder: history
          clean: true
