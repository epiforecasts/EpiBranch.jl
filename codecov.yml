# A commit's report is the coverage uploads together: each group
# of the root suite on two Julia versions, EpiNetwork and EpiHouseholds. When a
# job fails, its flag never uploads, and without carry-forward the files it
# covers vanish from the report: a failing root job left main measured on 483
# lines of 2913, so every pull request afterwards read as a two-point drop.
# Carrying a missing flag forward from the last commit that did upload it
# keeps the comparison about the change rather than about which jobs happened
# to run.
flag_management:
  default_rules:
    carryforward: true

# Thresholds. Without them a pull request fails whenever its own new lines are
# covered even slightly less well than the project average, which most pull
# requests are, and `project` fails on a drop of a hundredth of a point.
#
# `patch` has no `threshold`, so 90% is the bar. Note what that means for a
# small diff: with nine coverable lines, eight covered is 88.9% and fails, so a
# diff of a few lines effectively needs all of them covered. That is intended;
# override such a one by hand rather than lowering the bar for every diff.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%

# Post the status and comment once, when the `coverage` job in CI.yml says
# every upload is in. A report made after only some uploads compares a partly
# measured commit with its base and shows a drop of several points.
codecov:
  notify:
    manual_trigger: true
