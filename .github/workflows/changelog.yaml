name: Changelog

# A pull request records its entry as a file in `changelog.d/` (see that
# directory's README). This checks one is there, because the entry is easy to
# forget once it is no longer part of editing `CHANGELOG.md`.
#
# Add the `no changelog` label for a change that warrants no entry, such as one
# touching only CI or tests.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragment:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for a changelog fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Tolerated so this workflow can merge before or after the one that
          # creates the directory.
          if [ ! -d changelog.d ]; then
            echo "no changelog.d/ in this revision: nothing to check"
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD \
            -- 'changelog.d/*.md' | grep -v '^changelog.d/README.md$' || true)
          if [ -z "$added" ]; then
            echo "This pull request adds no changelog fragment."
            echo "Add changelog.d/<category>-<slug>.md, or apply the"
            echo "'no changelog' label if the change warrants no entry."
            echo "See changelog.d/README.md."
            exit 1
          fi
          echo "found:"
          echo "$added"
