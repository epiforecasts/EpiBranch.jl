# A commit's report is the four coverage uploads together: the root package on
# two Julia versions, EpiNetwork and EpiHouseholds. When a job fails, its flag
# never uploads, and without carry-forward the files it covers vanish from the
# report: a failing root job left main measured on 483 lines of 2913, so every
# pull request afterwards read as a two-point drop. Carrying a missing flag
# forward from the last commit that did upload it keeps the comparison about
# the change rather than about which jobs happened to run.
flag_management:
  default_rules:
    carryforward: true

# Thresholds. Without them a pull request fails whenever its own new lines are
# covered even slightly less well than the project average, which most pull
# requests are, and `project` fails on a drop of a hundredth of a point.
#
# `patch` carries no `threshold`, so 90% is the bar a diff actually has to
# clear. A target and a threshold on the same explicit number would mean
# neither figure in this file is the gate: codecov rescues a failing patch when
# `coverage >= target - threshold`, so `80%` with `threshold: 5%` would pass at
# 75%, and a run of such diffs would settle the project at that figure rather
# than the 96% it sits at now.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%
