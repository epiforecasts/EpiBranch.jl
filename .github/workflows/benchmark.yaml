# Taken from EpiAwarePackageTools' templates. No sync manages it yet, so edit
# it here and carry the change over if this repository adopts the kit.
name: Benchmark

# Benchmarks `benchmark/benchmarks.jl` against the pull request's base and
# posts a single comparison comment (a bucketed summary plus a collapsed detail
# table, from `EpiAwarePackageTools.Benchmarks.compare_comment`, called by
# `benchmark/compare.jl` below).
#
# Both revisions are benchmarked in one job, on the same runner, each from its
# own checkout, so each runs its own sources. That is what lets the two be
# compared across an API change, where one staged copy of the suite would have
# to work against both.
#
# Uses `pull_request` (not `pull_request_target`), so the comparison runs
# the PR's own code and the comment-posting token stays scoped to same-repo
# PRs; fork PRs get a read-only token and will not post a comment.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'ext/**'
      - 'benchmark/**'
      - 'test/ADFixtures/**'
      - 'lib/**'
      - '.github/workflows/benchmark.yaml'

# Read-only for the workflow. Only `compare` comments, and only that job takes
# the scope for it: the `benchmark` job runs `benchmark/benchmarks.jl` from the
# pull request's own checkout, which has no reason to hold a token that can
# write to issues.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both revisions on one runner. Hosted runners differ by up to 2x in speed,
  # so legs on separate runners compare the machines as much as the code.
  # Each revision is checked out into its own directory and runs its own
  # sources, which still lets the two be compared across an API change. The
  # suite runs in rounds, alternating main and pr, and `compare` gets each
  # benchmark's fastest round per revision: interference from other work on
  # the runner only ever slows a round down. The runner script is inlined (a
  # bare `BenchmarkTools` call) rather than calling the scaffolded
  # `benchmark/run.jl`, so it still works on an older revision that predates
  # that script.
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      # A revision from before this directory existed has no suite to run, and
      # the base of the pull request that adds it is one. That leg reports
      # nothing and `compare` says so, rather than the job failing on a
      # `benchmark/` that was never there.
      - name: Is there a suite at each revision?
        id: suite
        run: |
          # Only the base can legitimately predate the suite. The pull request
          # losing it is the pull request removing the thing this workflow
          # exists to run, so that fails here rather than being reported as an
          # expected absence by `compare`.
          if [ ! -f pr/benchmark/benchmarks.jl ]; then
            echo "::error::benchmark/benchmarks.jl is missing from this revision."
            exit 1
          fi
          mkdir -p results
          if [ -f main/benchmark/benchmarks.jl ]; then
            echo "main=true" >> "$GITHUB_OUTPUT"
          else
            echo "main=false" >> "$GITHUB_OUTPUT"
            echo "No benchmark/benchmarks.jl at the base revision; nothing to run."
            # A marker, so `compare` can tell a base that genuinely had no
            # suite from an artifact download that failed.
            echo "no suite at this revision" > results/no-suite.txt
          fi
      # The benchmark environment installs the package as a dependency
      # (pinned by relative path in its `[sources]`), and Pkg honours only the
      # *active* project's `[sources]`. A dependency pinned there by git
      # url/rev (not yet registered) cannot resolve, failing with "has no
      # known versions!" (EpiAware/EpiAwarePackageTools.jl#216). Register each such pin into a throwaway
      # registry in this runner's depot instead: registries are depot-level,
      # so the dependency resolves by name in every environment on the
      # runner. A package with no unregistered pins is a no-op.
      #
      # The scratch registry from an earlier run is stale (cached depot), so
      # drop it first, before the guard: otherwise a package that has since
      # dropped its pin is left with a registry still carrying the name,
      # which fails the depot with a hash mismatch.
      - name: Bootstrap registry for unregistered [sources] deps
        run: |
          rm -rf "${JULIA_DEPOT_PATH:-$HOME/.julia}/registries/EpiAwareScratch"
          dirs=()
          for rev in pr main; do
            [ -f "$rev/benchmark/benchmarks.jl" ] || continue
            if grep -qE '^\[sources(\.|\])' "$rev/benchmark/Project.toml"; then
              dirs+=("$rev/benchmark")
            fi
          done
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no [sources] section at either revision: nothing to register"
            exit 0
          fi
          julia -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add([
                Pkg.PackageSpec(name = "LocalRegistry"),
                Pkg.PackageSpec(
                    name = "EpiAwarePackageTools", version = "0.4")])
            using EpiAwarePackageTools.Benchmarks: bootstrap_sources_registry
            for dir in ARGS
                done = bootstrap_sources_registry(dir)
                println(dir, ": ", isempty(done) ? "no unregistered [sources] deps" :
                        "registered: " * join(done, ", "))
            end' "${dirs[@]}"
      # Precompiling takes most of the job, so both revisions do it at once.
      - name: Install and precompile
        run: |
          setup() {
            (cd "$1" && julia --project=benchmark -e '
              using Pkg
              Pkg.instantiate()
              Pkg.precompile()')
          }
          setup pr & pr_pid=$!
          if [ "${{ steps.suite.outputs.main }}" = "true" ]; then
            setup main & main_pid=$!
            wait "$main_pid"
          fi
          wait "$pr_pid"
      - name: Run benchmark suites
        run: |
          run_round() {
            (cd "$1" && julia --project=benchmark -e '
              using BenchmarkTools
              include("benchmark/benchmarks.jl")
              results = run(SUITE; verbose = true, seconds = 1)
              BenchmarkTools.save(ARGS[1], results)' "../results/$1-$2.json")
          }
          for order in "main pr" "pr main"; do
            round=$((${round:-0} + 1))
            for rev in $order; do
              if [ "$rev" = "main" ] && [ "${{ steps.suite.outputs.main }}" != "true" ]; then
                continue
              fi
              echo "::group::round $round: $rev"
              run_round "$rev" "$round"
              echo "::endgroup::"
            done
          done
      # One result file per revision, holding each benchmark's fastest round.
      - name: Keep each benchmark's fastest round
        run: |
          julia --project=pr/benchmark -e '
            using BenchmarkTools
            fastest(a::BenchmarkGroup, b::BenchmarkGroup) =
                (for k in keys(a); haskey(b, k) && (a[k] = fastest(a[k], b[k])); end; a)
            fastest(a, b) = minimum(b).time < minimum(a).time ? b : a
            for rev in ("pr", "main")
                files = filter(f -> startswith(f, rev * "-"), readdir("results"))
                isempty(files) && continue
                rounds = [BenchmarkTools.load(joinpath("results", f))[1] for f in files]
                BenchmarkTools.save("results/results-$rev.json", reduce(fastest, rounds))
                println(rev, ": fastest of ", length(rounds), " rounds")
            end'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-pr
          path: results/results-pr.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.suite.outputs.main == 'true'
        with:
          name: bench-main
          path: results/results-main.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.suite.outputs.main != 'true'
        with:
          name: bench-main
          path: results/no-suite.txt

  compare:
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # PR checkout (no ref override, so this always runs the workflow's own
      # commit): unlike the per-revision `benchmark` job above, this never
      # runs against an old baseline, so it can safely depend on the
      # kit-shipped `benchmark/compare.jl`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      # By name, one at a time: a bulk download flattens into `path` when the
      # run holds a single artifact, so the directory layout below would depend
      # on how many legs uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-pr
          path: artifacts/bench-pr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bench-main
          path: artifacts/bench-main
      # A leg that found no suite uploaded nothing, so there is no baseline to
      # compare against and the comparison is the only thing with nothing to
      # say. Reported in the summary and skipped, so the pull request that
      # introduces the suite is not held up by the absence it is fixing.
      - name: Is there a baseline to compare against?
        id: baseline
        run: |
          if [ -f artifacts/bench-main/results-main.json ] &&
             [ -f artifacts/bench-pr/results-pr.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [ -f artifacts/bench-main/no-suite.txt ]; then
            {
              echo "### Benchmark"
              echo
              echo "The base revision has no benchmark suite, so there is"
              echo "nothing to compare against. Expected on the pull request"
              echo "that introduces it."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No results to compare, although the base" \
              "revision has a suite."
            {
              echo "### Benchmark"
              echo
              echo "Results are missing while the base revision does have a"
              echo "suite, so the comparison was skipped. Check the"
              echo "Benchmark (main) leg and its artifact upload."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build comparison comment
        if: steps.baseline.outputs.present == 'true'
        # `compare.jl` only needs the kit (`compare_comment`) and
        # `BenchmarkTools` (lazily `Base.require`d to load result files), not
        # the package's own benchmark deps, so it runs in a scratch env that
        # always installs both rather than relying on `benchmark/Project.toml`
        # having them pinned — that file is package-owned and scaffold never
        # overwrites an adopter's pre-existing `benchmark/` dir, so either
        # dependency could otherwise be silently missing
        # (EpiAware/EpiAwarePackageTools.jl#821).
        run: |
          julia -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add([
                Pkg.PackageSpec(name = "EpiAwarePackageTools", version = "0.4"),
                Pkg.PackageSpec(name = "BenchmarkTools")])
            include("benchmark/compare.jl")' \
            artifacts/bench-pr/results-pr.json \
            artifacts/bench-main/results-main.json comment.md
          # The job summary carries the comparison whether or not the next step
          # can post it, so a fork PR's benchmark jobs still show a result.
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post comparison comment
        # A fork PR's token is read-only whatever `permissions:` says, so
        # commenting returns 403 and fails the job.
        if: >-
          steps.baseline.outputs.present == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- benchmark-comparison -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
