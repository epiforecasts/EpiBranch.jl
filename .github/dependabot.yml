version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Hold a new release for a week before opening a PR, so a compromised or
    # broken version has time to be caught and yanked before it can auto-merge.
    cooldown:
      default-days: 7
    # Bundle bumps so a run produces two PRs rather than one per action.
    #
    # Two groups, not one: `dependabot/fetch-metadata` reports a group's
    # update-type as the highest semver level in it, so batching a major in with
    # patch and minor bumps would make the whole batch read as major and stop
    # dependabot-auto-merge.yml taking any of it. Splitting keeps the routine
    # bumps on the automatic path and leaves majors for review.
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
