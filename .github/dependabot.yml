version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Hold a new release for a week before opening a PR, so a compromised or
    # broken version has time to be caught and yanked before it can auto-merge.
    cooldown:
      default-days: 7
    # Bundle every github-actions bump into a single grouped PR per run. Without
    # this, one upstream release opens a separate PR per workflow file that
    # references it, which buries real review work under version bumps.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    reviewers:
      - "sbfnk"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Julia dependencies. This repo has no `[workspace]` in the root
  # Project.toml, so a single "/" would only reach the main package; the
  # environments are listed instead. Grouped, so a run produces one PR across
  # all of them rather than one per environment per package.
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/test"
      - "/docs"
      - "/lib/EpiNetwork"
      - "/lib/EpiHouseholds"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      julia:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    reviewers:
      - "sbfnk"
    commit-message:
      prefix: "chore"
      include: "scope"
