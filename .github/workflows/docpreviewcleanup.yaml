# Taken from EpiAwarePackageTools' templates. No sync manages it yet, so edit
# it here and carry the change over if this repository adopts the kit.
name: Doc Preview Cleanup

# `docs/make.jl` deploys with `push_preview = true`, so every PR leaves a
# directory under `previews/` on `gh-pages` that nothing removes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  doc-preview-cleanup:
    uses: EpiAware/.github/.github/workflows/docs-preview-cleanup.yml@2c7ce73459772f11dad46ac7f456e35f0d296faf
